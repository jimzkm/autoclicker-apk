<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Auto Clicker</title>
    <meta name="theme-color" content="#0f3460">
    <meta name="description" content="Auto clicker sederhana untuk Android - klik bergantian di beberapa titik">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="icons/icon-192.png" type="image/png">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a2e;
            color: #e0e0e0;
            overflow: hidden;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Panel kontrol di atas */
        .control-panel {
            background: #16213e;
            padding: 15px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
            border-bottom: 2px solid #0f3460;
        }

        .control-panel h1 {
            font-size: 18px;
            color: #00d4ff;
            flex: 1 0 100%;
        }

        .setting-group {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .setting-group label {
            font-size: 12px;
            color: #a0a0a0;
        }

        .setting-group input,
        .setting-group select {
            padding: 8px;
            border: 1px solid #0f3460;
            border-radius: 6px;
            background: #1a1a2e;
            color: #e0e0e0;
            font-size: 14px;
            width: 120px;
        }

        button {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        button:active {
            transform: scale(0.97);
        }

        .btn-add-point {
            background: #2ecc71;
            color: white;
        }

        .btn-add-point.active {
            background: #34d058;
            color: white;
            box-shadow: 0 0 10px #2ecc71;
        }

        .btn-start {
            background: #00d4ff;
            color: #1a1a2e;
        }

        .btn-stop {
            background: #e74c3c;
            color: white;
        }

        .btn-clear {
            background: #9b59b6;
            color: white;
        }

        /* Area klik utama */
        .click-area {
            flex: 1;
            position: relative;
            background: #0f3460;
            cursor: crosshair;
            touch-action: manipulation;
        }

        /* Marker titik klik */
        .click-point {
            position: absolute;
            width: 24px;
            height: 24px;
            border: 2px solid #00d4ff;
            border-radius: 50%;
            background: rgba(0, 212, 255, 0.2);
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 10;
        }

        .click-point.active-click {
            border-color: #e74c3c;
            background: rgba(231, 76, 60, 0.5);
            animation: pulse 0.3s;
        }

        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            50% { transform: translate(-50%, -50%) scale(1.3); }
            100% { transform: translate(-50%, -50%) scale(1); }
        }

        /* Info titik klik */
        .point-label {
            position: absolute;
            top: -8px;
            left: 50%;
            transform: translateX(-50%);
            background: #00d4ff;
            color: #1a1a2e;
            font-size: 10px;
            font-weight: bold;
            padding: 2px 6px;
            border-radius: 4px;
            pointer-events: none;
            white-space: nowrap;
        }

        /* Status */
        .status-bar {
            background: #16213e;
            padding: 8px 15px;
            font-size: 13px;
            color: #a0a0a0;
            display: flex;
            justify-content: space-between;
        }

        .status-indicator {
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
        }

        .status-dot.running {
            background: #2ecc71;
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.4; }
        }

        /* Overlay petunjuk */
        .overlay-instruction {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: #a0a0a0;
            font-size: 16px;
            pointer-events: none;
            z-index: 5;
        }

        /* Tombol hapus titik */
        .btn-remove-point {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            font-size: 12px;
            cursor: pointer;
            z-index: 20;
            display: none;
        }
    </style>
</head>
<body>
    <!-- Panel kontrol -->
    <div class="control-panel">
        <h1>🖱️ Auto Clicker</h1>

        <div class="setting-group">
            <label for="speed">Kecepatan (ms)</label>
            <input type="number" id="speed" min="100" max="5000" value="500" step="50">
        </div>

        <div class="setting-group">
            <label for="mode">Mode</label>
            <select id="mode">
                <option value="cycle">Giliran (Cycle)</option>
                <option value="random">Acak (Random)</option>
            </select>
        </div>

        <div class="setting-group">
            <label for="repeat">Jumlah Klik</label>
            <input type="number" id="repeat" min="0" max="99999" value="0" step="1">
            <small style="color:#777; font-size:10px;">0 = tak terbatas</small>
        </div>

        <button id="btnAddPoint" class="btn-add-point">➕ Tambah Titik</button>
        <button id="btnStart" class="btn-start">▶️ Mulai</button>
        <button id="btnStop" class="btn-stop" style="display:none;">⏹️ Berhenti</button>
        <button id="btnClear" class="btn-clear">🗑️ Hapus Semua</button>
    </div>

    <!-- Area klik -->
    <div class="click-area" id="clickArea">
        <div class="overlay-instruction" id="overlayInstruction">
            Klik "Tambah Titik" lalu sentuh area untuk menentukan titik klik
        </div>
    </div>

    <!-- Status bar -->
    <div class="status-bar">
        <div style="display: flex; gap: 20px;">
            <span>Jumlah titik: <strong id="pointCount">0</strong></span>
            <span>Total klik: <strong id="totalClicks">0</strong></span>
            <span>Sisa klik: <strong id="remainingClicks">-</strong></span>
        </div>
        <div class="status-indicator">
            <span>Status:</span>
            <span class="status-dot" id="statusDot"></span>
            <span id="statusText">Siap</span>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        // Registrasi Service Worker untuk PWA (caching offline)
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(reg => console.log('SW registered:', reg.scope))
                .catch(err => console.warn('SW failed:', err));
        }
    </script>
</body>
</html>
