name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools,build-tools;34.0.0,platforms;android-34,cmdline-tools;latest

    - name: Make gradlew executable
      run: chmod +x ./gradlew

    - name: Build Release APK
      run: |
        ./gradlew assembleRelease --no-daemon --stacktrace 2>&1 || true
        echo "=== Build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la app/build/outputs/apk/release/ 2>/dev/null || echo "No release APK found"

    - name: Build Debug APK
      run: |
        ./gradlew assembleDebug --no-daemon --stacktrace 2>&1 || true
        echo "=== Debug build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null
        ls -la app/build/outputs/apk/debug/ 2>/dev/null || echo "No debug APK found"

    - name: List all artifacts
      run: |
        echo "=== All build outputs ==="
        find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== app/build directory ==="
        ls -la app/build/ 2>/dev/null || echo "No app/build directory"

    - name: Upload APK (release)
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore

    - name: Upload APK (debug)
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
