name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Install Gradle
      run: |
        curl -o gradle.zip https://services.gradle.org/gradle/8.10.2-bin.zip
        unzip -q gradle.zip
        echo "$PWD/gradle-8.10.2/bin" >> "$GITHUB_PATH"
        gradle --version

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools: 34.0.0
        ndk: 26.1.10909125
        cmake: 3.22.1

    - name: Verify Android environment
      run: |
        echo "ANDROID_HOME: $ANDROID_HOME"
        echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
        echo "--- Platform Tools ---"
        ls $ANDROID_HOME/platform-tools/ | head -5
        echo "--- Build Tools ---"
        ls $ANDROID_HOME/build-tools/

    - name: Generate Gradle Wrapper
      run: |
        cd android-app
        gradle wrapper --gradle-version 8.10.2 --distribution-type bin
        chmod +x ./gradlew

    - name: Build Release APK
      run: |
        cd android-app
        ./gradlew assembleRelease --no-daemon --stacktrace

    - name: Locate APK
      run: |
        find . -name "*.apk" -type f
        echo "--- Release APK ---"
        ls -la android-app/app/build/outputs/apk/release/
        echo "--- Debug APK ---"
        ls -la android-app/app/build/outputs/apk/debug/

    - name: Upload APK (release)
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: android-app/app/build/outputs/apk/release/*.apk

    - name: Upload APK (debug)
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: android-app/app/build/outputs/apk/debug/*.apk
