name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17
        cache: gradle

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        packages: platform-tools,build-tools;34.0.0,platforms;android-34,cmdline-tools;latest

    - name: Install Gradle
      run: |
        echo "Installing Gradle 8.10.2..."
        curl -sL -o /tmp/gradle.zip https://services.gradle.org/gradle/8.10.2-bin.zip
        cd /tmp && unzip -q gradle.zip
        echo "/tmp/gradle-8.10.2/bin" >> "$GITHUB_PATH"
        gradle --version

    - name: Build Debug APK
      run: |
        gradle assembleDebug --no-daemon --stacktrace 2>&1
        echo "=== Debug build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: Build Release APK
      run: |
        gradle assembleRelease --no-daemon --stacktrace 2>&1
        echo "=== Release build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: List all artifacts
      run: |
        echo "=== All build outputs ==="
        find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== app/build directory ==="
        ls -la app/build/ 2>/dev/null || echo "No app/build directory"

    - name: Upload APK (release)
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore

    - name: Upload APK (debug)
      if: always()
      uses: actions/upload-artifact@v5
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
