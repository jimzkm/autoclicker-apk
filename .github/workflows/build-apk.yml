name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Setup JDK 17
      uses: actions/setup-java@v5
      with:
        distribution: 'temurin'
        java-version: 17

    - name: Setup Gradle
      uses: gradle/gradle-build-action@v2
      with:
        gradle-version: 8.10.2
        cache-disabled: true

    - name: Setup Android SDK
      run: |
        echo "=== Manual Android SDK setup ==="
        export ANDROID_HOME=/usr/local/lib/android/sdk
        export ANDROID_SDK_ROOT=$ANDROID_HOME
        echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
        echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT" >> $GITHUB_ENV
        mkdir -p $ANDROID_HOME

        echo "=== Install commandlinetools ==="
        wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O /tmp/cmdline.zip
        cd $ANDROID_HOME
        unzip -q /tmp/cmdline.zip
        mkdir -p cmdline-tools/latest
        cp -r cmdline-tools/* cmdline-tools/latest/ 2>/dev/null || true

        echo "=== Accept licenses ==="
        yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1

        echo "=== Install SDK packages ==="
        $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager \
          "platform-tools" "build-tools;34.0.0" "platforms;android-34" 2>&1

        echo "=== Verify SDK ==="
        ls $ANDROID_HOME/platform-tools/ | head -5
        ls $ANDROID_HOME/build-tools/
        ls $ANDROID_HOME/platforms/

    - name: Configure local.properties
      run: |
        echo "sdk.dir=/usr/local/lib/android/sdk" > local.properties
        echo "Created local.properties"
        cat local.properties

    - name: Build Debug APK
      run: |
        set +e
        gradle assembleDebug --no-daemon --stacktrace 2>&1 | tee /tmp/build_debug.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::BUILD FAILED! Outputting error lines as annotations:"
          grep -iE '(error|e:|exception|failed|caused by|could not|cannot|FAILURE)' /tmp/build_debug.log | head -30 | while IFS= read -r line; do
            echo "::error::$line"
          done
          echo "::error::=== Last 25 lines of build log ==="
          tail -25 /tmp/build_debug.log | while IFS= read -r line; do
            echo "::error::$line"
          done
          # Push error log to a separate branch for detailed debugging
          echo "=== Pushing error log to error-log branch ==="
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git checkout -B error-log
          cp /tmp/build_debug.log build_error_debug.log
          git add build_error_debug.log
          git commit -m "Build error log from failed run" || true
          git push origin error-log --force 2>&1 || echo "push failed but continuing"
          exit $EXIT_CODE
        fi
        echo "=== Debug build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: Build Release APK
      run: |
        set +e
        gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee /tmp/build_release.log
        EXIT_CODE=${PIPESTATUS[0]}
        if [ $EXIT_CODE -ne 0 ]; then
          echo "::error::Gradle RELEASE BUILD FAILED (exit code $EXIT_CODE). Key errors:"
          grep -iE '(error|e:|exception|failed|caused by|could not|cannot)' /tmp/build_release.log | head -20
          echo "::error::=== Last 20 lines of build log ==="
          tail -20 /tmp/build_release.log
          exit $EXIT_CODE
        fi
        echo "=== Release build outputs ==="
        find . -name "*.apk" -type f 2>/dev/null

    - name: List all artifacts
      run: |
        echo "=== All build outputs ==="
        find app/build -name "*.apk" -type f 2>/dev/null || echo "No APK files found"
        echo "=== app/build directory ==="
        ls -la app/build/ 2>/dev/null || echo "No app/build directory"

    - name: Upload APK (release)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        if-no-files-found: ignore

    - name: Upload APK (debug)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: app-debug-apk
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: ignore
